  <style>
    /* ============================================================
       GAYA TAMPILAN WEBSITE Karang Taruna<br>INSAN MULYA
       Palet warna diambil dari logo: marun, emas, putih.
       (Bagian ini boleh tidak diubah; semua teks ada di objek DATA.)
       ============================================================ */

    :root {
      --marun: #7B3226;          /* warna utama */
      --marun-gelap: #64281E;    /* marun lebih gelap (hover, footer) */
      --marun-sangat-gelap: #511E16;
      --emas: #F2B705;           /* aksen emas */
      --emas-lembut: #FFDD7A;
      --putih: #FFFFFF;
      --abu-muda: #F7F5F2;       /* latar seksi selang-seling */
      --teks: #222222;
      --teks-lembut: #5D554E;
      --garis: #E8E1D7;
      --hijau-wa: #1DA851;       /* hijau WhatsApp */
      --bayangan: 0 10px 30px rgba(34, 34, 34, 0.10);
      --bayangan-ringan: 0 3px 12px rgba(34, 34, 34, 0.06);
      --radius: 16px;
      --font-judul: 'Montserrat', 'Segoe UI', Arial, sans-serif;
      --font-isi: 'Roboto', 'Segoe UI', Arial, sans-serif;
    }

    /* ---------- Dasar ---------- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      scroll-padding-top: 88px; /* agar judul seksi tidak tertutup header menempel */
      -webkit-text-size-adjust: 100%;
    }
    @media (prefers-reduced-motion: no-preference) {
      html { scroll-behavior: smooth; }
    }

    body {
      font-family: var(--font-isi);
      font-size: 16px;
      line-height: 1.75;
      color: var(--teks);
      background: var(--putih);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 100%;
      overflow-x: clip;
      -webkit-font-smoothing: antialiased;
    }

    main { flex: 1 0 auto; }

    img { max-width: 100%; display: block; }

    h1, h2, h3, h4 {
      font-family: var(--font-judul);
      line-height: 1.3;
      color: var(--marun);
      font-weight: 700;
    }

    p { overflow-wrap: break-word; }

    /* wadah lebar konten */
    .wadah {
      width: min(100% - 2.5rem, 1120px);
      margin-inline: auto;
    }

    /* tautan loncat ke konten (aksesibilitas keyboard) */
    .lewati-link {
      position: absolute;
      left: -9999px;
      top: 0;
      z-index: 300;
      background: var(--putih);
      color: var(--marun);
      font-weight: 700;
      padding: 0.8rem 1.3rem;
      border-radius: 0 0 12px 0;
      box-shadow: var(--bayangan);
      text-decoration: none;
    }
    .lewati-link:focus { left: 0; }

    /* fokus keyboard terlihat jelas */
    :focus-visible {
      outline: 3px solid var(--marun);
      outline-offset: 2px;
      border-radius: 4px;
    }
    .kepala :focus-visible,
    .hero :focus-visible,
    .footer :focus-visible { outline-color: var(--emas); }

    /* ---------- Tombol ---------- */
    .tombol {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      font-family: var(--font-judul);
      font-weight: 700;
      font-size: 0.95rem;
      line-height: 1.2;
      min-height: 48px;
      padding: 0.8rem 1.6rem;
      border-radius: 999px;
      border: 2px solid transparent;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }
    .tombol .ikon { width: 20px; height: 20px; flex-shrink: 0; }

    .tombol-utama {
      background: var(--emas);
      color: var(--marun-gelap);
      box-shadow: 0 8px 20px rgba(242, 183, 5, 0.35);
    }
    .tombol-utama:hover, .tombol-utama:focus-visible {
      background: var(--emas-lembut);
      transform: translateY(-2px);
    }

    .tombol-garis {
      border-color: rgba(255, 255, 255, 0.75);
      color: var(--putih);
      background: rgba(255, 255, 255, 0.07);
    }
    .tombol-garis:hover, .tombol-garis:focus-visible {
      background: rgba(255, 255, 255, 0.16);
      border-color: var(--putih);
      transform: translateY(-2px);
    }

    .tombol-wa {
      background: linear-gradient(135deg, #178A43, #25D366);
      color: var(--putih);
      border: 2px solid var(--emas);
      box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3);
    }
    .tombol-wa:hover, .tombol-wa:focus-visible {
      filter: brightness(1.07);
      transform: translateY(-2px);
    }

    .tombol-email {
      background: var(--putih);
      border: 2px solid var(--marun);
      color: var(--marun);
    }
    .tombol-email:hover, .tombol-email:focus-visible {
      background: var(--marun);
      color: var(--putih);
    }

    /* ---------- Header (menempel/sticky) ---------- */
    .kepala {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--marun);
      box-shadow: 0 3px 0 rgba(242, 183, 5, 0.65), 0 6px 18px rgba(0, 0, 0, 0.18);
      transition: background-color 0.3s ease;
    }
    .kepala.menggulir { background: var(--marun-gelap); }

    .baris-kepala {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 72px;
      position: relative;
    }

    .merek {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      text-decoration: none;
      min-width: 0;
    }
    .merek-logo { width: 52px; height: 52px; flex-shrink: 0; }
    .merek-logo img { width: 100%; height: 100%; object-fit: contain; }
    .merek-teks { display: flex; flex-direction: column; min-width: 0; }
    .merek-nama {
      font-family: var(--font-judul);
      font-weight: 700;
      color: var(--putih);
      font-size: 1rem;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .merek-sub {
      color: var(--emas);
      font-size: 0.68rem;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* menu di layar lebar */
    @media (min-width: 920px) {
      .daftar-menu {
        display: flex;
        align-items: center;
        gap: 0.2rem;
        list-style: none;
      }
      .daftar-menu a {
        display: block;
        color: var(--putih);
        text-decoration: none;
        font-weight: 500;
        font-size: 0.95rem;
        padding: 0.55rem 0.85rem;
        position: relative;
      }
      .daftar-menu a::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 2px;
        transform: translateX(-50%);
        width: 0;
        height: 3px;
        border-radius: 3px;
        background: var(--emas);
        transition: width 0.25s ease;
      }
      .daftar-menu a:hover::after,
      .daftar-menu a.aktif::after { width: 58%; }
      .daftar-menu a.aktif { color: var(--emas); }
      .tombol-menu { display: none; }
    }

    /* tombol hamburger di HP */
    .tombol-menu {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.45);
      color: var(--putih);
      border-radius: 10px;
      padding: 0.6rem 0.85rem;
      font-family: var(--font-isi);
      font-weight: 500;
      font-size: 0.95rem;
      cursor: pointer;
      min-height: 48px;
    }
    .tombol-menu .ikon { width: 22px; height: 22px; display: block; }

    @media (max-width: 919.98px) {
      .daftar-menu {
        position: absolute;
        top: 100%;
        left: -1.25rem;
        right: -1.25rem;
        background: var(--marun-gelap);
        list-style: none;
        padding: 0.5rem 1.4rem 1rem;
        display: none;
        box-shadow: 0 20px 30px rgba(0, 0, 0, 0.3);
        border-top: 1px solid rgba(242, 183, 5, 0.4);
      }
      .navigasi.terbuka .daftar-menu { display: block; }
      .daftar-menu a {
        display: block;
        color: var(--putih);
        text-decoration: none;
        padding: 0.95rem 0.4rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.14);
        font-weight: 500;
      }
      .daftar-menu li:last-child a { border-bottom: 0; }
      .daftar-menu a.aktif { color: var(--emas); }
      .daftar-menu a:hover { color: var(--emas); }
    }

    /* ---------- Hero (bagian atas beranda) ---------- */
    .hero {
      position: relative;
      overflow: hidden;
      background: linear-gradient(150deg, #83372A 0%, var(--marun) 45%, var(--marun-sangat-gelap) 100%);
      color: var(--putih);
      padding-block: clamp(4rem, 9vw, 6.5rem) clamp(6rem, 12vw, 8.5rem);
      border-bottom: 5px solid var(--emas);
    }
    .hero-ornamen {
      position: absolute;
      right: -14%;
      top: 50%;
      transform: translateY(-50%);
      width: min(78vw, 620px);
      opacity: 0.15;
      pointer-events: none;
      user-select: none;
    }
    .hero-ornamen svg { width: 100%; height: auto; display: block; }

    .hero-konten { position: relative; max-width: 680px; }
    .hero-judul {
      color: var(--putih);
      font-size: clamp(1.9rem, 5.6vw, 3.05rem);
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 0.7rem;
    }
    .hero-judul .aksen { color: var(--emas); }
    .hero-sub {
      color: var(--emas-lembut);
      font-family: var(--font-judul);
      font-weight: 600;
      font-size: clamp(0.98rem, 2.4vw, 1.18rem);
      letter-spacing: 0.3px;
      margin-bottom: 0.9rem;
    }
    .hero-kalimat {
      color: rgba(255, 255, 255, 0.88);
      font-size: 1.03rem;
      max-width: 540px;
      margin-bottom: 2.1rem;
    }
    .hero-aksi { display: flex; flex-wrap: wrap; gap: 0.9rem; }

    /* ---------- Angka ringkas ---------- */
    .statistik { position: relative; z-index: 5; margin-top: -3.4rem; }
    .kartu-statistik {
      background: var(--putih);
      border-radius: var(--radius);
      border-top: 4px solid var(--emas);
      box-shadow: var(--bayangan);
      display: grid;
      grid-template-columns: 1fr;
      overflow: hidden;
    }
    @media (min-width: 640px) {
      .kartu-statistik { grid-template-columns: repeat(3, 1fr); }
    }
    .stat-item { padding: 1.5rem 1rem 1.4rem; text-align: center; position: relative; }
    @media (min-width: 640px) {
      .stat-item + .stat-item::before {
        content: "";
        position: absolute;
        top: 22%;
        bottom: 22%;
        left: 0;
        width: 1px;
        background: var(--garis);
      }
    }
    @media (max-width: 639.98px) {
      .stat-item + .stat-item { border-top: 1px solid var(--garis); }
    }
    .stat-angka {
      font-family: var(--font-judul);
      font-weight: 800;
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      color: var(--marun);
      line-height: 1.15;
    }
    .stat-angka--lebar { font-size: clamp(1.35rem, 4vw, 1.9rem); letter-spacing: 0.5px; }
    .stat-label {
      font-size: 0.78rem;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--teks-lembut);
      font-weight: 500;
      margin-top: 0.15rem;
    }
    /* ---------- Judul seksi ---------- */
    .seksi { padding-block: clamp(3.4rem, 7vw, 5.5rem); }
    .seksi-alt { background: var(--abu-muda); }

    .kepala-seksi { text-align: center; max-width: 720px; margin: 0 auto clamp(2.2rem, 5vw, 3.2rem); }
    .jenis-seksi {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(242, 183, 5, 0.16);
      border: 1px solid rgba(242, 183, 5, 0.55);
      color: var(--marun);
      font-family: var(--font-judul);
      font-weight: 700;
      font-size: 0.74rem;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      padding: 0.35rem 1rem;
      border-radius: 999px;
      margin-bottom: 0.9rem;
    }
    .kepala-seksi h2 { font-size: clamp(1.55rem, 3.8vw, 2.15rem); font-weight: 800; }
    .garis-hias {
      width: 72px;
      height: 4px;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--emas), var(--emas-lembut), var(--emas));
      margin: 0.85rem auto 0;
    }
    .sub-seksi { color: var(--teks-lembut); margin-top: 0.9rem; font-size: 0.98rem; }

    /* ---------- Sambutan ---------- */
    .bagian-sambutan { padding-top: clamp(3.6rem, 8vw, 5.5rem); }
    .sambutan {
      display: grid;
      gap: 1.6rem;
      margin-bottom: clamp(3rem, 7vw, 4.5rem);
    }
    @media (min-width: 880px) {
      .sambutan { grid-template-columns: 290px 1fr; gap: 3rem; align-items: start; }
      .sambutan--kanan .sambutan-foto { order: 2; }
    }

    .sambutan-foto { display: flex; flex-direction: column; align-items: center; }
    .foto-bulat {
      width: min(225px, 62vw);
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid var(--emas);
      background: #EBE5DB;
      box-shadow: var(--bayangan);
      display: grid;
      place-items: center;
    }
    .foto-bulat img { width: 100%; height: 100%; object-fit: cover; }
    .foto-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      color: #8B8175;
      font-size: 0.78rem;
      font-weight: 500;
      text-align: center;
      padding: 1rem;
    }
    .foto-placeholder .ikon { width: 40px; height: 40px; opacity: 0.75; }

    .sambutan-teks h3 { font-size: clamp(1.25rem, 2.8vw, 1.55rem); margin-bottom: 1.1rem; }
    .sambutan-teks p { margin-bottom: 1rem; color: #3B3631; }
    /* teks sambutan: rata kiri-kanan di layar lebar, rata kiri di HP kecil */
    .rata-justify { text-align: left; }
    @media (min-width: 768px) { .rata-justify { text-align: justify; } }

    .tanda-tangan { margin-top: 1.7rem; display: flex; flex-direction: column; }
    .tanda-tangan::before {
      content: "";
      width: 48px;
      height: 3px;
      border-radius: 3px;
      background: var(--emas);
      margin-bottom: 0.6rem;
    }
    .tanda-tangan .nama {
      font-family: var(--font-judul);
      font-weight: 700;
      color: var(--marun);
      font-size: 1.05rem;
    }
    .tanda-tangan .peran { font-size: 0.88rem; color: var(--teks-lembut); }

    /* ---------- Kartu berita ---------- */
    .berita-grid { display: grid; gap: 1.4rem; grid-template-columns: 1fr; }
    @media (min-width: 640px) { .berita-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 960px) { .berita-grid { grid-template-columns: repeat(3, 1fr); } }

    .kartu-berita {
      background: var(--putih);
      border: 1px solid var(--garis);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--bayangan-ringan);
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .kartu-berita:hover { transform: translateY(-4px); box-shadow: var(--bayangan); }
    .berita-gambar {
      aspect-ratio: 16 / 9;
      background: #E9E3D8;
      display: grid;
      place-items: center;
      color: #8B8175;
    }
    .berita-gambar img { width: 100%; height: 100%; object-fit: cover; }
    .berita-isi { padding: 1.25rem 1.3rem 1.45rem; }
    .berita-meta {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: var(--teks-lembut);
      margin-bottom: 0.45rem;
    }
    .berita-meta .ikon { width: 15px; height: 15px; }
    .berita-judul { font-size: 1.05rem; margin-bottom: 0.4rem; }
    .berita-ringkasan { font-size: 0.92rem; color: #4A443E; }

    /* ---------- Profil: visi, misi, dasar hukum ---------- */
    .profil-grid { display: grid; gap: 1.5rem; }
    @media (min-width: 920px) { .profil-grid { grid-template-columns: 1fr 1.15fr; align-items: stretch; } }

    .kartu-visi {
      position: relative;
      overflow: hidden;
      background: linear-gradient(155deg, var(--marun) 0%, var(--marun-sangat-gelap) 100%);
      border-radius: var(--radius);
      padding: 2.1rem 1.9rem;
      color: var(--putih);
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 260px;
    }
    .kartu-visi h3 { color: var(--emas); font-size: 1.15rem; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 1rem; }
    .kartu-visi .tanda-kutip {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 4.5rem;
      line-height: 0.6;
      color: rgba(242, 183, 5, 0.5);
      margin-bottom: 0.6rem;
    }
    .kartu-visi p {
      font-family: var(--font-judul);
      font-weight: 600;
      font-size: 1.12rem;
      line-height: 1.65;
    }

    .kartu-misi {
      background: var(--putih);
      border: 1px solid var(--garis);
      border-radius: var(--radius);
      padding: clamp(1.5rem, 3.5vw, 2.1rem);
      box-shadow: var(--bayangan-ringan);
    }
    .kartu-misi h3 { font-size: 1.15rem; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 1.2rem; }
    .daftar-misi { list-style: none; counter-reset: misi; display: grid; gap: 1rem; }
    .daftar-misi li {
      counter-increment: misi;
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 0.95rem;
      align-items: start;
    }
    .daftar-misi li::before {
      content: counter(misi, decimal-leading-zero);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(242, 183, 5, 0.18);
      border: 2px solid var(--emas);
      color: var(--marun);
      font-family: var(--font-judul);
      font-weight: 700;
      display: grid;
      place-items: center;
      font-size: 0.95rem;
    }
    .daftar-misi .teks { padding-top: 0.45rem; color: #3B3631; }

    .dasar-hukum {
      margin-top: 1.5rem;
      background: var(--putih);
      border: 1px solid var(--garis);
      border-radius: var(--radius);
      padding: clamp(1.5rem, 3.5vw, 2.1rem);
      box-shadow: var(--bayangan-ringan);
    }
    .dasar-hukum h3 { font-size: 1.15rem; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 1.2rem; }
    .daftar-hukum { list-style: none; display: grid; gap: 0.9rem; }
    .daftar-hukum li {
      display: grid;
      grid-template-columns: 46px 1fr;
      gap: 1rem;
      align-items: start;
      background: var(--abu-muda);
      border-left: 4px solid var(--emas);
      border-radius: 10px;
      padding: 1rem 1.1rem;
    }
    .ikon-dok {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: var(--marun);
      color: var(--emas);
      display: grid;
      place-items: center;
    }
    .ikon-dok .ikon { width: 24px; height: 24px; }
    .daftar-hukum .judul { font-weight: 700; color: var(--marun); font-family: var(--font-judul); font-size: 0.95rem; overflow-wrap: anywhere; }
    .daftar-hukum .ket { font-size: 0.9rem; color: var(--teks-lembut); }

    /* ---------- Struktur organisasi ---------- */
    .tingkat { margin-bottom: 0.5rem; }
    .tingkat-judul-wrap {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.4rem;
    }
    .tingkat-judul-wrap::before,
    .tingkat-judul-wrap::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--garis));
    }
    .tingkat-judul-wrap::after { background: linear-gradient(90deg, var(--garis), transparent); }
    .tingkat-judul {
      background: var(--marun);
      color: var(--emas);
      font-family: var(--font-judul);
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      padding: 0.5rem 1.35rem;
      border-radius: 999px;
      text-align: center;
    }
    .tingkat-judul .kecil { display: block; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.6px; color: rgba(255, 221, 122, 0.9); text-transform: none; }

    .penghubung {
      width: 2px;
      height: 2.4rem;
      margin: 0.4rem auto 1.8rem;
      background: linear-gradient(180deg, var(--emas), #D9C9A8);
      position: relative;
    }
    .penghubung::after {
      content: "";
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%) rotate(45deg);
      width: 8px;
      height: 8px;
      background: var(--emas);
      border-radius: 2px;
    }

    .grid-org { display: grid; gap: 1rem; grid-template-columns: 1fr; }
    @media (min-width: 620px) { .grid-org { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 980px) { .grid-org { grid-template-columns: repeat(4, 1fr); } .grid-org--3 { grid-template-columns: repeat(3, 1fr); } }

    .kartu-org {
      background: var(--putih);
      border: 1px solid var(--garis);
      border-radius: 14px;
      padding: 1.2rem 1.1rem;
      box-shadow: var(--bayangan-ringan);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
    }
    .kartu-org--utama {
      border: 2px solid var(--emas);
      background: linear-gradient(180deg, #FFFDF2, var(--putih));
    }
    .kartu-org .peran {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--teks-lembut);
      font-weight: 700;
    }
    .kartu-org .nama {
      font-family: var(--font-judul);
      font-weight: 700;
      color: var(--marun);
      font-size: 1rem;
    }
    .kartu-org .ket { font-size: 0.82rem; color: var(--teks-lembut); }
    .chip-daftar { display: flex; flex-wrap: wrap; gap: 0.45rem; justify-content: center; margin-top: 0.35rem; }
    .chip-nama {
      display: inline-block;
      background: rgba(123, 50, 38, 0.08);
      color: var(--marun);
      border: 1px solid rgba(123, 50, 38, 0.2);
      padding: 0.25rem 0.8rem;
      border-radius: 999px;
      font-weight: 500;
      font-size: 0.86rem;
    }

    /* accordion 11 bidang */
    .bidang-daftar { display: grid; gap: 0.7rem; max-width: 880px; margin-inline: auto; }
    .bidang-item {
      background: var(--putih);
      border: 1px solid var(--garis);
      border-radius: 14px;
      overflow: hidden;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .bidang-item.terbuka { border-color: rgba(242, 183, 5, 0.85); box-shadow: var(--bayangan-ringan); }
    .bidang-tombol {
      all: unset;
      box-sizing: border-box;
      display: grid;
      grid-template-columns: 40px 1fr 26px;
      align-items: center;
      gap: 0.85rem;
      width: 100%;
      padding: 0.85rem 1.1rem;
      cursor: pointer;
      font-family: var(--font-judul);
    }
    .bidang-tombol:focus-visible { outline: 3px solid var(--marun); outline-offset: -3px; border-radius: 12px; }
    .bidang-nomor {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--marun);
      color: var(--emas);
      font-weight: 700;
      font-size: 0.88rem;
      display: grid;
      place-items: center;
    }
    .bidang-nama { font-weight: 600; font-size: 0.93rem; color: var(--teks); line-height: 1.4; }
    .bidang-tombol .panah { width: 22px; height: 22px; color: var(--marun); transition: transform 0.3s ease; }
    .bidang-item.terbuka .panah { transform: rotate(180deg); }
    .bidang-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.3s ease; }
    .bidang-item.terbuka .bidang-panel { grid-template-rows: 1fr; }
    .bidang-panel-dalam { overflow: hidden; }
    .bidang-isi {
      padding: 0.15rem 1.1rem 1.05rem calc(40px + 0.85rem + 1.1rem);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem;
    }
    @media (max-width: 639.98px) { .bidang-isi { padding-left: 1.1rem; } }
    .bidang-label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 1px; color: var(--teks-lembut); font-weight: 700; }

    .catatan-struktur {
      margin-top: 2.2rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--teks-lembut);
      font-style: italic;
      max-width: 720px;
      margin-inline: auto;
      overflow-wrap: anywhere;
    }

    /* ---------- Program kerja ---------- */
    .program-grid { display: grid; gap: 1.3rem; grid-template-columns: 1fr; }
    @media (min-width: 620px) { .program-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1000px) { .program-grid { grid-template-columns: repeat(3, 1fr); } }

    .kartu-program {
      position: relative;
      background: var(--putih);
      border: 1px solid var(--garis);
      border-radius: var(--radius);
      padding: 1.7rem 1.5rem 1.6rem;
      box-shadow: var(--bayangan-ringan);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .kartu-program::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--emas), var(--emas-lembut));
    }
    .kartu-program:hover { transform: translateY(-4px); box-shadow: var(--bayangan); }
    .program-ikon {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background: var(--marun);
      color: var(--emas);
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 0 2px rgba(242, 183, 5, 0.45);
    }
    .program-ikon .ikon { width: 28px; height: 28px; }
    .program-nomor {
      position: absolute;
      top: 1.15rem;
      right: 1.25rem;
      font-family: var(--font-judul);
      font-weight: 800;
      font-size: 1.7rem;
      color: rgba(123, 50, 38, 0.13);
      line-height: 1;
    }
    .kartu-program h3 { font-size: 1.06rem; line-height: 1.4; }
    .kartu-program p { font-size: 0.93rem; color: #4A443E; }

    /* tabel agenda */
    .bungkus-tabel {
      background: var(--putih);
      border: 1px solid var(--garis);
      border-radius: 14px;
      box-shadow: var(--bayangan-ringan);
      overflow: hidden;
    }
    .tabel { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
    .tabel th {
      background: var(--marun);
      color: var(--putih);
      font-family: var(--font-judul);
      font-weight: 700;
      font-size: 0.78rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: left;
      padding: 0.9rem 1.1rem;
    }
    .tabel td { padding: 0.9rem 1.1rem; border-bottom: 1px solid var(--garis); color: #4A443E; vertical-align: top; }
    .tabel tbody tr:nth-child(even) { background: var(--abu-muda); }
    .tabel tbody tr:last-child td { border-bottom: 0; }
    @media (max-width: 639.98px) {
      .tabel thead { display: none; }
      .tabel, .tabel tbody, .tabel tr, .tabel td { display: block; width: 100%; }
      .tabel tbody tr { background: var(--abu-muda) !important; border-bottom: 10px solid var(--putih); padding: 0.4rem 0; }
      .tabel tbody tr:last-child { border-bottom: 0; }
      .tabel td { display: flex; justify-content: space-between; gap: 1rem; border-bottom: 1px dashed var(--garis); padding: 0.55rem 1.1rem; }
      .tabel tr td:last-child { border-bottom: 0; }
      .tabel td::before {
        content: attr(data-label);
        font-weight: 700;
        color: var(--marun);
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        flex-shrink: 0;
        padding-top: 0.15rem;
      }
    }

    /* galeri */
    .galeri-grid { display: grid; gap: 1rem; grid-template-columns: repeat(2, 1fr); }
    @media (min-width: 800px) { .galeri-grid { grid-template-columns: repeat(3, 1fr); } }
    .galeri-item {
      aspect-ratio: 4 / 3;
      border-radius: 14px;
      background: #E9E3D8;
      border: 1.5px dashed #C9BFA9;
      display: grid;
      place-items: center;
      color: #8B8175;
      font-size: 0.8rem;
      font-weight: 500;
      overflow: hidden;
    }
    .galeri-item .isi { display: flex; flex-direction: column; align-items: center; gap: 0.45rem; text-align: center; padding: 0.5rem; }
    .galeri-item .ikon { width: 32px; height: 32px; opacity: 0.75; }
    .galeri-item img { width: 100%; height: 100%; object-fit: cover; }

    /* ---------- Kontak ---------- */
    .kontak-grid { display: grid; gap: 1.7rem; }
    @media (min-width: 960px) { .kontak-grid { grid-template-columns: 1fr 1.08fr; align-items: start; } }

    .kontak-kartu-daftar { display: grid; gap: 0.9rem; }
    .kontak-kartu {
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: 1rem;
      align-items: center;
      background: var(--putih);
      border: 1px solid var(--garis);
      border-radius: 14px;
      padding: 1rem 1.15rem;
      box-shadow: var(--bayangan-ringan);
    }
    .kontak-ikon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(123, 50, 38, 0.08);
      border: 1px solid rgba(123, 50, 38, 0.16);
      color: var(--marun);
      display: grid;
      place-items: center;
    }
    .kontak-ikon .ikon { width: 24px; height: 24px; }
    .kontak-kartu .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--teks-lembut);
      font-weight: 700;
    }
    .kontak-kartu .nilai { font-weight: 600; color: var(--teks); font-size: 0.95rem; overflow-wrap: anywhere; }
    a.nilai { color: var(--marun); text-decoration: none; }
    a.nilai:hover { text-decoration: underline; }

    .tombol-wa-bungkus { margin-top: 0.2rem; }
    .tombol-wa-bungkus .tombol { width: 100%; }

    .peta {
      margin-top: 0.9rem;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--garis);
      box-shadow: var(--bayangan-ringan);
      background: #E9E3D8;
    }
    .peta iframe { width: 100%; height: 320px; border: 0; display: block; }

    .kartu-formulir {
      background: var(--putih);
      border: 1px solid var(--garis);
      border-top: 5px solid var(--emas);
      border-radius: var(--radius);
      box-shadow: var(--bayangan);
      padding: clamp(1.6rem, 4vw, 2.3rem);
    }
    .kartu-formulir h3 { font-size: 1.3rem; margin-bottom: 0.4rem; }
    .kartu-formulir .pengantar { font-size: 0.9rem; color: var(--teks-lembut); margin-bottom: 1.5rem; }

    .form-grid { display: grid; gap: 1.05rem; }
    @media (min-width: 640px) { .form-dua { grid-template-columns: 1fr 1fr; display: grid; gap: 1.05rem; } }

    .kelompok label { display: block; font-weight: 600; font-size: 0.88rem; margin-bottom: 0.35rem; }
    .kelompok .wajib { color: #B3261E; }
    .kelompok input,
    .kelompok select,
    .kelompok textarea {
      width: 100%;
      padding: 0.75rem 0.95rem;
      border: 1.5px solid #D8D0C2;
      border-radius: 10px;
      font: inherit;
      color: var(--teks);
      background: #FDFCFA;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .kelompok input:focus-visible,
    .kelompok select:focus-visible,
    .kelompok textarea:focus-visible {
      outline: none;
      border-color: var(--emas);
      box-shadow: 0 0 0 3px rgba(242, 183, 5, 0.4);
    }
    .kelompok textarea { min-height: 130px; resize: vertical; }
    .kelompok .bantuan { font-size: 0.78rem; color: var(--teks-lembut); margin-top: 0.3rem; }

    .form-aksi { display: grid; gap: 0.8rem; margin-top: 0.3rem; }
    @media (min-width: 480px) { .form-aksi { grid-template-columns: 1fr 1fr; } }
    .catatan-form {
      display: flex;
      gap: 0.45rem;
      align-items: flex-start;
      font-size: 0.8rem;
      color: var(--teks-lembut);
      margin-top: 1rem;
      line-height: 1.5;
    }
    .catatan-form .ikon { width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px; }

    /* ---------- Footer ---------- */
    .footer {
      background: linear-gradient(170deg, var(--marun-gelap), var(--marun-sangat-gelap));
      color: rgba(255, 255, 255, 0.85);
      margin-top: auto;
    }
    .footer-atas {
      padding: clamp(2.8rem, 6vw, 4rem) 0 2.4rem;
      display: grid;
      gap: 2.4rem;
      grid-template-columns: 1fr;
    }
    @media (min-width: 880px) { .footer-atas { grid-template-columns: 1.35fr 1.1fr 0.75fr; } }

    .footer-merek { display: flex; gap: 0.9rem; align-items: flex-start; }
    .footer-logo { width: 56px; height: 56px; flex-shrink: 0; }
    .footer-logo img { width: 100%; height: 100%; object-fit: contain; }
    .footer-merek .nama { font-family: var(--font-judul); font-weight: 700; color: var(--putih); font-size: 1.05rem; line-height: 1.4; }
    .footer-merek .wilayah { font-size: 0.85rem; color: rgba(255, 255, 255, 0.7); margin-top: 0.2rem; }
    .footer-situs {
      margin-top: 1.1rem;
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(242, 183, 5, 0.45);
      border-radius: 12px;
      padding: 0.5rem 0.9rem 0.5rem 0.55rem;
      text-decoration: none;
      color: var(--emas);
      font-weight: 600;
      font-size: 0.9rem;
      transition: background-color 0.25s ease;
    }
    .footer-situs:hover { background: rgba(255, 255, 255, 0.14); }
    .footer-situs .lingkaran {
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--putih);
      display: grid; place-items: center;
      overflow: hidden; flex-shrink: 0;
    }
    .footer-situs .lingkaran img { width: 82%; height: 82%; object-fit: contain; }
    .footer-situs .ikon { width: 14px; height: 14px; opacity: 0.8; }

    .footer h4 {
      color: var(--emas);
      font-size: 0.82rem;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .footer-daftar-kontak { list-style: none; display: grid; gap: 0.8rem; font-size: 0.9rem; }
    .footer-daftar-kontak li { display: grid; grid-template-columns: 22px 1fr; gap: 0.6rem; align-items: start; }
    .footer-daftar-kontak .ikon { width: 18px; height: 18px; color: var(--emas); margin-top: 4px; }
    .footer-daftar-kontak a { color: rgba(255, 255, 255, 0.85); text-decoration: none; overflow-wrap: anywhere; }
    .footer-daftar-kontak a:hover { color: var(--emas); text-decoration: underline; }

    .footer-menu { list-style: none; display: grid; gap: 0.55rem; font-size: 0.9rem; }
    .footer-menu a { color: rgba(255, 255, 255, 0.85); text-decoration: none; }
    .footer-menu a:hover { color: var(--emas); }

    .footer-bawah {
      border-top: 1px solid rgba(242, 183, 5, 0.25);
      padding: 1.25rem 0 1.45rem;
      text-align: center;
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.72);
      overflow-wrap: anywhere;
    }

    /* ---------- Tombol kembali ke atas ---------- */
    .tombol-atas {
      position: fixed;
      right: 1.1rem;
      bottom: 1.1rem;
      z-index: 90;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid var(--marun);
      background: var(--emas);
      color: var(--marun);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(34, 34, 34, 0.3);
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s;
    }
    .tombol-atas.tampil { opacity: 1; visibility: visible; transform: none; }
    .tombol-atas:hover { background: var(--emas-lembut); }
    .tombol-atas .ikon { width: 22px; height: 22px; }

    /* ---------- Animasi muncul saat digulir ---------- */
    .fade { opacity: 0; transform: translateY(20px); transition: opacity 0.65s ease, transform 0.65s ease; }
    .fade.terlihat { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .fade { opacity: 1; transform: none; transition: none; }
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    /* cetak */
    @media print {
      .kepala, .tombol-atas, .hero-ornamen, .peta { display: none !important; }
      body { overflow: visible; }
    }
  </style>
</head>

  <a class="lewati-link" href="#konten-utama">Langsung ke konten utama</a>

  <!-- ================= HEADER (menempel di atas) ================= -->
  <header class="kepala" id="kepala">

          <span class="merek-sub" id="merekSub">Kelurahan Pasir Mulya &middot; Kota Bogor</span>

  <main id="konten-utama">

    <!-- ================= BERANDA ================= -->
    <section id="beranda" aria-label="Beranda">

      <div class="hero">

            <path d="M100 24 C 90 52, 90 74, 100 94 C 110 74, 110 52, 100 24 Z" transform="rotate(135 100 100)"/>
            <path d="M100 24 C 90 52, 90 74, 100 94 C 110 74, 110 52, 100 24 Z" transform="rotate(180 100 100)"/>
            <path d="M100 24 C 90 52, 90 74, 100 94 C 110 74, 110 52, 100 24 Z" transform="rotate(225 100 100)"/>
            <path d="M100 24 C 90 52, 90 74, 100 94 C 110 74, 110 52, 100 24 Z" transform="rotate(270 100 100)"/>

          </svg>

      <!-- Angka ringkas -->
      <div class="wadah">
        <div class="statistik" id="isiStatistik"></div>
      </div>

      <!-- Sambutan Lurah & Ketua -->
      <div class="wadah bagian-sambutan">
        <div id="isiSambutanLurah"></div>
        <div id="isiSambutanKetua"></div>
      </div>

      <!-- Berita -->
      <div class="wadah" id="isiBerita"></div>
    </section>

    <!-- ================= PROFIL ================= -->
    <section id="profil" class="seksi-alt seksi" aria-label="Profil organisasi">
      <div class="wadah" id="isiProfil"></div>
    </section>

    <!-- ================= STRUKTUR ORGANISASI ================= -->
    <section id="struktur" class="seksi seksi" aria-label="Struktur organisasi">
      <div class="wadah" id="isiStruktur"></div>

  // keamanan kecil: teks dari DATA diubah dulu agar aman ditampilkan
  function esc(t) {
    return String(t == null ? "" : t)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function placeholderFoto() {

  }

  /* =====================================================================
     PERILAKU INTERAKTIF
     ===================================================================== */

  // logo, favicon, dan teks merek
  function pasangIdentitas() {
    el("logoHeader").src = DATA.identitas.logo;
    el("merekNama").textContent = DATA.identitas.nama;
    el("merekSub").textContent = DATA.identitas.wilayahSingkat;
    el("ikonSitus").href = DATA.identitas.logo;
  }

  // menu hamburger
  function siapkanMenu() {
    const nav = el("navigasi");
    const tombol = el("tombolMenu");
    const ikon = el("ikonMenu");
    const setIkon = (buka) => { ikon.innerHTML = buka ? IKON.silang : IKON.menu; };
    setIkon(false);

    const tutup = () => { nav.classList.remove("terbuka"); tombol.setAttribute("aria-expanded", "false"); setIkon(false); };
    tombol.addEventListener("click", (e) => {
      e.stopPropagation();
      const buka = !nav.classList.contains("terbuka");
      nav.classList.toggle("terbuka", buka);
      tombol.setAttribute("aria-expanded", String(buka));
      setIkon(buka);
    });
    nav.querySelectorAll("a").forEach((a) => a.addEventListener("click", tutup));
    document.addEventListener("click", (e) => { if (!nav.contains(e.target)) tutup(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") tutup(); });
  }

  // header berubah saat digulir + tombol kembali ke atas + penanda menu aktif
  function siapkanGulir() {
    const kepala = el("kepala");
    const tombolAtas = el("tombolAtas");
    tombolAtas.querySelector(".ikon").innerHTML = IKON.panahAtas;

    const perbarui = () => {
      const y = window.scrollY || document.documentElement.scrollTop;
      kepala.classList.toggle("menggulir", y > 10);
      tombolAtas.classList.toggle("tampil", y > 480);
    };
    window.addEventListener("scroll", perbarui, { passive: true });
    perbarui();

    tombolAtas.addEventListener("click", () => window.scrollTo({ top: 0, left: 0 }));

    // penanda menu aktif mengikuti posisi gulir
    const tautan = Array.from(document.querySelectorAll(".daftar-menu a"));
    const seksi = DATA.menu.map((m) => document.querySelector(m.href)).filter(Boolean);
    if ("IntersectionObserver" in window && seksi.length) {
      const pengamat = new IntersectionObserver((entri) => {
        entri.forEach((en) => {
          if (!en.isIntersecting) return;
          tautan.forEach((a) => a.classList.toggle("aktif", a.getAttribute("href") === "#" + en.target.id));
        });
      }, { rootMargin: "-35% 0px -55% 0px", threshold: 0 });
      seksi.forEach((s) => pengamat.observe(s));
    }
  }

  // accordion 11 bidang (buka-tutup)
  function siapkanAccordion() {
    document.querySelectorAll(".bidang-tombol").forEach((t) => {
      t.addEventListener("click", () => {
        const item = t.closest(".bidang-item");
        const buka = !item.classList.contains("terbuka");
        item.classList.toggle("terbuka", buka);
        t.setAttribute("aria-expanded", String(buka));
      });
    });
  }

  // formulir aspirasi -> WhatsApp / Email
  function siapkanFormulir() {
    const form = el("formAspirasi");
    const susunPesan = () => {
      const v = (id) => el(id).value.trim();
      return "Halo Karang Taruna<br>Insan Mulya,\n\n" +
        "Saya ingin menyampaikan *" + v("fJenis") + "* melalui website resmi.\n\n" +
        "Nama: " + v("fNama") + "\n" +
        "RT/RW: " + (v("fRtrw") || "-") + "\n" +
        "Kontak: " + (v("fKontak") || "-") + "\n\n" +
        "Isi pesan:\n" + v("fPesan");
    };

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (!form.checkValidity()) { form.reportValidity(); return; }
      window.open(WA_LINK + "?text=" + encodeURIComponent(susunPesan()), "_blank", "noopener");
    });

    el("tombolEmailForm").addEventListener("click", () => {
      if (!form.checkValidity()) { form.reportValidity(); return; }
      const subjek = "[Aspirasi] Pesan dari website - " + el("fNama").value.trim();
      const isi = susunPesan().replace(/\*/g, "");
      window.location.href = "mailto:" + DATA.identitas.email +
        "?subject=" + encodeURIComponent(subjek) +
        "&body=" + encodeURIComponent(isi);
    });
  }

  // animasi muncul saat digulir (hemat, hormati prefers-reduced-motion)
  function siapkanFade() {
    const item = document.querySelectorAll(".fade");
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches || !("IntersectionObserver" in window)) {
      item.forEach((n) => n.classList.add("terlihat"));
      return;
    }
    const pengamat = new IntersectionObserver((entri) => {
      entri.forEach((en) => {
        if (en.isIntersecting) { en.target.classList.add("terlihat"); pengamat.unobserve(en.target); }
      });
    }, { threshold: 0.12, rootMargin: "0px 0px -30px 0px" });
    item.forEach((n) => pengamat.observe(n));
  }

  siapkanMenu();
  siapkanGulir();

  siapkanFormulir();
  siapkanFade();
  </script>
